<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יוצאים לאור – אזור מנחה</title>
<link rel="stylesheet" href="shared/core.css">
<style>
  .session-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#FAFBFA}
  .roster-check{display:flex;align-items:center;gap:8px;font-size:15px;padding:6px 0}
  .roster-check input{width:auto}
</style>
</head>
<body>

<header>
  <div class="glow"></div>
  <div class="head-inner">
    <h1 style="text-align:center">יוצאים <span>לאור</span></h1>
    <p class="sub" style="text-align:center">אזור מנחה</p>
  </div>
</header>

<main class="narrow">

  <div id="viewLoading" class="card"><p class="loading">טוען…</p></div>

  <div id="viewInvalid" class="card hidden" style="text-align:center">
    <div class="lock-icon">🚫</div>
    <h2 style="font-size:18px;margin-bottom:8px">הקישור לא תקין</h2>
    <p style="font-size:14px;color:var(--ink-soft)">אם קיבלת קישור הזה מהעמותה וזה לא עובד, כדאי לבדוק מול הרכז/ת - יכול להיות שהקישור התיישן.</p>
  </div>

  <div id="viewApp" class="hidden">
    <div class="card" style="margin-bottom:16px">
      <h2 id="actTitle" style="font-size:20px;margin-bottom:4px"></h2>
      <p id="actMeta" style="font-size:14px;color:var(--ink-soft)"></p>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2 style="font-size:17px;margin-bottom:12px">חברי הקבוצה</h2>
      <div id="rosterArea"><p class="loading">טוען…</p></div>
    </div>

    <div class="card">
      <h2 style="font-size:17px;margin-bottom:12px">מפגשים</h2>
      <div class="field" style="margin-bottom:16px">
        <label>בחירת תאריך מפגש</label>
        <select id="sessSelect"><option value="">טוען…</option></select>
      </div>
      <div id="sessionsArea"></div>
      <details style="margin-top:16px">
        <summary style="cursor:pointer;color:var(--sage-dark);font-size:13px">מפגש חדש שעוד לא ברשימה?</summary>
        <div style="margin-top:10px">
          <input type="date" id="newSessDate" style="margin-bottom:8px">
          <button class="btn-line" id="addSessBtn" style="padding:8px 16px;font-size:13px">+ הוספת מפגש</button>
        </div>
      </details>
    </div>
  </div>

</main>

<script src="shared/core.js"></script>
<script>
(function(){
  "use strict";
  const {$, esc, fmtDate} = YL;
  const token = new URLSearchParams(location.search).get("token");

  async function rpc(name, args){
    const res = await fetch(YL.SUPABASE_URL+"/rest/v1/rpc/"+name,{
      method:"POST",
      headers:{apikey:YL.SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify(args)
    });
    if(!res.ok){ const t=await res.text(); throw new Error(t.slice(0,300)); }
    const text=await res.text();
    if(!text) return null;
    try{ return JSON.parse(text); }catch(e){ return null; }
  }

  let roster = [];

  async function init(){
    if(!token){ showInvalid(); return; }
    try{
      const acts = await rpc("facilitator_get_activity",{p_token:token});
      if(!acts || !acts.length){ showInvalid(); return; }
      const act = acts[0];
      $("actTitle").textContent = act.title;
      $("actMeta").textContent = act.type + (act.audience ? " · "+act.audience : "") + (act.city ? " · 📍 "+act.city : "");
      $("viewLoading").classList.add("hidden");
      $("viewApp").classList.remove("hidden");
      await loadRoster();
      await loadSessions();
    }catch(e){ showInvalid(); }
  }
  function showInvalid(){
    $("viewLoading").classList.add("hidden");
    $("viewInvalid").classList.remove("hidden");
  }

  async function loadRoster(){
    try{
      roster = await rpc("facilitator_get_roster",{p_token:token});
      $("rosterArea").innerHTML = roster.length ? roster.map(m=>
        '<p style="padding:4px 0">'+(m.is_facilitator?'⭐ ':'')+esc((m.first_name||"")+" "+(m.last_name||""))+'</p>'
      ).join('') : '<p style="font-size:13px;color:var(--ink-soft)">אין עדיין חברי קבוצה רשומים - פנה/י לרכז/ת כדי להוסיף.</p>';
    }catch(e){
      $("rosterArea").innerHTML = '<p style="color:var(--err);font-size:13px">טעינת חברי הקבוצה נכשלה</p>';
    }
  }

  let allSessions = [];
  let selectedSessionId = null;

  async function loadSessions(){
    $("sessSelect").innerHTML = '<option value="">טוען…</option>';
    try{
      allSessions = await rpc("facilitator_get_sessions",{p_token:token});
      renderSessionSelect();
    }catch(e){
      $("sessSelect").innerHTML = '<option value="">טעינה נכשלה</option>';
    }
  }

  function renderSessionSelect(){
    if(!allSessions.length){
      $("sessSelect").innerHTML = '<option value="">אין עדיין מפגשים - הוסיפו למטה</option>';
      $("sessionsArea").innerHTML = '';
      return;
    }
    $("sessSelect").innerHTML = allSessions.map(s=>
      '<option value="'+s.id+'">'+(s.session_date?fmtDate(s.session_date):'ללא תאריך')+'</option>'
    ).join('');
    // בררת מחדל: המפגש הקרוב ביותר לתאריך היום, או האחרון ברשימה אם כולם עברו
    if(!selectedSessionId || !allSessions.some(s=>s.id===selectedSessionId)){
      const todayStr=new Date().toISOString().slice(0,10);
      const upcoming=allSessions.find(s=>s.session_date && s.session_date>=todayStr);
      selectedSessionId = upcoming ? upcoming.id : allSessions[allSessions.length-1].id;
    }
    $("sessSelect").value = selectedSessionId;
    renderSessionPanel();
  }

  $("sessSelect").addEventListener("change", function(){
    selectedSessionId = this.value;
    renderSessionPanel();
  });

  function renderSessionPanel(){
    const area = $("sessionsArea");
    const s = allSessions.find(x=>x.id===selectedSessionId);
    if(!s){ area.innerHTML=''; return; }
    area.innerHTML =
      '<div class="field" style="margin-top:6px;margin-bottom:6px"><label style="font-size:12px">משוב על המפגש</label>'+
        '<textarea rows="3" id="fbText">'+esc(s.facilitator_feedback||"")+'</textarea>'+
        '<div style="display:flex;align-items:center;gap:8px;margin-top:4px">'+
          '<button type="button" class="btn-ghost" id="saveFbBtn" style="font-size:12px">שמירת משוב</button>'+
          '<span id="fbStatus" style="font-size:12px;color:#256B33;font-weight:700;display:none">✓ נשמר בהצלחה</span>'+
        '</div></div>'+
      '<div style="margin-top:10px"><p style="font-size:12px;color:var(--mid);margin-bottom:6px">נוכחות</p>'+
        '<div id="attendArea"><p class="loading">טוען…</p></div></div>';

    $("saveFbBtn").onclick = async function(){
      const btn=this, statusEl=$("fbStatus");
      btn.disabled=true; btn.textContent="שומר…"; statusEl.style.display="none";
      try{
        await rpc("facilitator_save_feedback",{p_token:token, p_session_id:s.id, p_feedback:$("fbText").value});
        s.facilitator_feedback = $("fbText").value;
        btn.textContent="שמירת משוב"; btn.disabled=false;
        statusEl.style.display="inline";
        setTimeout(()=>{statusEl.style.display="none";},2500);
      }catch(e){ alert("השמירה נכשלה"); btn.disabled=false; btn.textContent="שמירת משוב"; }
    };

    renderAttendance(s.id);
  }

  async function renderAttendance(sessionId){
    const area = $("attendArea");
    if(!roster.length){
      area.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">אין חברי קבוצה רשומים עדיין.</p>';
      return;
    }
    area.innerHTML = '<p class="loading">טוען…</p>';
    try{
      const current = await rpc("facilitator_get_attendance",{p_token:token, p_session_id:sessionId});
      const presentIds = new Set((current||[]).map(c=>c.person_id));
      area.innerHTML = roster.map(m=>
        '<label class="roster-check"><input type="checkbox" data-person="'+m.person_id+'" '+(presentIds.has(m.person_id)?'checked':'')+'>'+
        esc((m.first_name||"")+" "+(m.last_name||""))+'</label>'
      ).join('');
      area.querySelectorAll('[data-person]').forEach(cb=>{
        cb.onchange=async function(){
          this.disabled=true;
          try{
            if(this.checked) await rpc("facilitator_mark_present",{p_token:token, p_session_id:sessionId, p_person_id:this.dataset.person});
            else await rpc("facilitator_mark_absent",{p_token:token, p_session_id:sessionId, p_person_id:this.dataset.person});
          }catch(e){ alert("העדכון נכשל"); this.checked=!this.checked; }
          this.disabled=false;
        };
      });
    }catch(e){
      area.innerHTML = '<p style="color:var(--err);font-size:13px">הטעינה נכשלה</p>';
    }
  }

  $("addSessBtn").onclick = async function(){
    const date=$("newSessDate").value;
    if(!date){ alert("נא לבחור תאריך"); return; }
    this.disabled=true;
    try{
      const newId = await rpc("facilitator_add_session",{p_token:token, p_date:date, p_location:null});
      $("newSessDate").value="";
      selectedSessionId = newId;
      await loadSessions();
    }catch(e){ alert("ההוספה נכשלה"); }
    this.disabled=false;
  };

  init();
})();
</script>
</body>
</html>
