<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יוצאים לאור – כל האנשים</title>
<link rel="stylesheet" href="shared/core.css">
</head>
<body>

<header>
  <div class="glow"></div>
  <div class="head-inner">
    <div class="head-top">
      <div>
        <h1>יוצאים <span>לאור</span></h1>
        <p class="sub">כל האנשים במערכת</p>
      </div>
    </div>
    <nav id="moduleNav" class="hidden"></nav>
  </div>
</header>

<main>

  <section id="viewInitLoading">
    <div class="card tiny" style="text-align:center">
      <p class="loading">טוען…</p>
    </div>
  </section>

  <section id="viewLock" class="hidden">
    <div class="card tiny">
      <div class="lock-icon">🔒</div>
      <h2 style="font-size:20px;margin-bottom:4px">כניסת צוות</h2>
      <div class="field" style="text-align:right">
        <label>מייל</label>
        <input id="loginEmail" inputmode="email" dir="ltr" placeholder="you@example.com">
      </div>
      <div class="field" style="text-align:right">
        <label>סיסמה</label>
        <input type="password" id="loginPass">
      </div>
      <p class="errmsg" id="loginErr" style="display:none;margin-bottom:8px">ההתחברות נכשלה - בדקו מייל וסיסמה.</p>
      <button class="btn" id="loginBtn">כניסה</button>
    </div>
  </section>

  <section id="viewNoAccess" class="hidden">
    <div class="card tiny">
      <div class="lock-icon">🚫</div>
      <h2 style="font-size:20px;margin-bottom:4px">אין לך הרשאה למודול זה</h2>
      <p style="font-size:14px;color:var(--ink-soft);margin-bottom:20px">מסך זה דורש הרשאת מנהל/ת מערכת או רכז/ת פניות.</p>
      <button class="btn-ghost" id="logoutBtn0">התנתקות</button>
    </div>
  </section>

  <section id="viewMain" class="hidden">
    <div class="dash-head">
      <div>
        <h2 style="font-size:20px">כל האנשים</h2>
        <p style="font-size:14px;color:var(--ink-soft)"><span id="counter"></span> · כולל מי שאין לו/ה פנייה (רשימת תפוצה, מנחים, אורחי תוכן וכו')</p>
      </div>
      <div class="dash-actions">
        <button class="btn-line" id="newPersonBtn">+ איש/אשת קשר חדש/ה</button>
        <button class="btn-ghost" id="refreshBtn">↻ רענון</button>
        <button class="btn-ghost" id="logoutBtn1">התנתקות (<span class="who1"></span>)</button>
      </div>
    </div>

    <div class="card hidden" id="newPersonCard" style="margin-bottom:20px">
      <h2 style="font-size:17px;margin-bottom:16px">איש/אשת קשר חדש/ה</h2>
      <div class="row2">
        <div class="field"><label>שם פרטי <span class="req">*</span></label><input id="npFirst"></div>
        <div class="field"><label>שם משפחה</label><input id="npLast"></div>
      </div>
      <div class="row2">
        <div class="field"><label>טלפון</label><input id="npPhone" dir="ltr"></div>
        <div class="field"><label>מייל</label><input id="npEmail" dir="ltr"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="saveNewPersonBtn" style="width:auto;padding:12px 24px">שמירה</button>
        <button class="btn-ghost" id="cancelNewPersonBtn">ביטול</button>
      </div>
    </div>

    <div class="filters">
      <input id="fSearch" placeholder="חיפוש שם / טלפון / מייל…" style="grid-column:1/-1">
    </div>

    <div id="listArea"><p class="loading">טוען…</p></div>
  </section>

</main>

<script src="shared/core.js"></script>
<script>
(function(){
  "use strict";
  const {$, esc, fmtDate, api} = YL;

  async function showApp(){
    const user = await YL.getUser();
    if(!user){ $("viewInitLoading").classList.add("hidden"); $("viewLock").classList.remove("hidden"); return; }
    YL.renderModuleNav($("moduleNav"), "people.html");
    let roles=[];
    try{ roles = await api("/staff_roles?auth_user_id=eq."+user.id+"&select=role"); }catch(e){ roles=[]; }
    const allowed = roles.some(r=>r.role==="מנהל/ת מערכת" || r.role==="רכז/ת פניות");
    if(!allowed){
      $("viewLock").classList.add("hidden");
      $("viewNoAccess").classList.remove("hidden");
      return;
    }
    $("viewLock").classList.add("hidden");
    $("viewInitLoading").classList.add("hidden");
    $("viewNoAccess").classList.add("hidden");
    $("viewMain").classList.remove("hidden");
    document.querySelectorAll(".who1").forEach(el=>el.textContent=YL.whoami()||"");
    loadPeople();
  }
  ["logoutBtn0","logoutBtn1"].forEach(id=>$(id).onclick=()=>{YL.logout();location.reload()});
  $("loginBtn").onclick=async function(){
    $("loginErr").style.display="none";
    this.disabled=true;
    try{ await YL.login($("loginEmail").value.trim(), $("loginPass").value); await showApp(); }
    catch(e){ $("loginErr").style.display="block"; }
    this.disabled=false;
  };

  // ═══ איש קשר חדש ═══
  $("newPersonBtn").onclick=()=>$("newPersonCard").classList.remove("hidden");
  $("cancelNewPersonBtn").onclick=()=>$("newPersonCard").classList.add("hidden");
  $("saveNewPersonBtn").onclick=async function(){
    const first=$("npFirst").value.trim();
    if(!first){ alert("נא למלא שם פרטי"); return; }
    this.disabled=true;
    try{
      await api("/persons",{method:"POST",body:JSON.stringify({
        first_name:first, last_name:$("npLast").value.trim()||null,
        phone:$("npPhone").value.trim()||null, email:$("npEmail").value.trim()||null,
        source:"manual"
      })});
      ["npFirst","npLast","npPhone","npEmail"].forEach(id=>$(id).value="");
      $("newPersonCard").classList.add("hidden");
      loadPeople();
    }catch(e){ alert("השמירה נכשלה: "+e.message.slice(0,200)); }
    this.disabled=false;
  };

  // ═══ רשימה ═══
  let people=[];
  let expanded=null;
  let editingId=null;

  $("refreshBtn").onclick=loadPeople;
  let searchDebounce;
  $("fSearch").addEventListener("input",()=>{
    clearTimeout(searchDebounce);
    searchDebounce=setTimeout(loadPeople,300);
  });

  async function loadPeople(){
    $("listArea").innerHTML='<p class="loading">טוען…</p>';
    try{
      const q=$("fSearch").value.trim();
      let url="/persons?select=*,person_roles(role)&order=created_at.desc&limit=200";
      if(q.length>=2){
        url="/persons?select=*,person_roles(role)&order=created_at.desc&limit=200&or=(first_name.ilike.*"+encodeURIComponent(q)+"*,last_name.ilike.*"+encodeURIComponent(q)+"*,phone.ilike.*"+encodeURIComponent(q)+"*,email.ilike.*"+encodeURIComponent(q)+"*)";
      }
      people=await api(url);
      render();
    }catch(e){
      $("listArea").innerHTML='<div class="empty"><p>הטעינה נכשלה</p><p>'+esc(e.message.slice(0,200))+'</p></div>';
    }
  }

  function render(){
    $("counter").textContent=people.length+" איש/ה"+(people.length===200?" (מוצגים 200 ראשונים - חפשו כדי לצמצם)":"");
    const area=$("listArea");
    if(!people.length){
      area.innerHTML='<div class="empty"><p>אין תוצאות</p></div>';
      return;
    }
    let html='<div class="table-scroll"><table><thead><tr><th>שם</th><th>טלפון</th><th>מייל</th><th>תפקידים</th><th>נוצר/ה</th></tr></thead><tbody>';
    people.forEach(p=>{
      const roleTags=(p.person_roles||[]).map(r=>r.role).join(", ")||"—";
      html+='<tr class="main-row" data-row="'+p.id+'">'+
        '<td style="font-weight:600">'+esc((p.first_name||"")+" "+(p.last_name||""))+'</td>'+
        '<td dir="ltr">'+esc(p.phone||"—")+'</td>'+
        '<td dir="ltr">'+esc(p.email||"—")+'</td>'+
        '<td>'+esc(roleTags)+'</td>'+
        '<td>'+fmtDate(p.created_at)+'</td>'+
      '</tr>';
      if(expanded===p.id){
        const isEditing=editingId===p.id;
        html+='<tr class="detail-row"><td colspan="5">';
        if(isEditing){
          html+=
            '<div class="row2">'+
              '<div class="field"><label>שם פרטי</label><input data-e="first_name" value="'+esc(p.first_name||"")+'"></div>'+
              '<div class="field"><label>שם משפחה</label><input data-e="last_name" value="'+esc(p.last_name||"")+'"></div>'+
            '</div>'+
            '<div class="row2">'+
              '<div class="field"><label>טלפון</label><input data-e="phone" value="'+esc(p.phone||"")+'" dir="ltr"></div>'+
              '<div class="field"><label>מייל</label><input data-e="email" value="'+esc(p.email||"")+'" dir="ltr"></div>'+
            '</div>'+
            '<div class="field"><label>אזור</label><input data-e="region_hint" value="'+esc(p.region_hint||"")+'"></div>'+
            '<div style="display:flex;gap:8px;margin-bottom:12px">'+
              '<button type="button" class="btn-line" data-save="'+p.id+'" style="width:auto;padding:8px 20px">💾 שמירה</button>'+
              '<button type="button" class="btn-ghost" data-cancel>ביטול</button>'+
            '</div>';
        } else {
          html+=
            (p.region_hint?'<p><b>אזור:</b> '+esc(p.region_hint)+'</p>':"")+
            '<p><b>מקור:</b> '+esc(p.source||"—")+'</p>'+
            '<p><b>סטטוס קהילה:</b> '+esc(p.community_status||"לא קהילה")+'</p>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
              '<button type="button" class="btn-ghost" data-edit="'+p.id+'">✏ עריכה</button>'+
              '<button type="button" class="btn-line" data-add-referral="'+p.id+'" style="width:auto;padding:8px 16px;font-size:13px">➕ יצירת פנייה</button>'+
              '<button type="button" class="btn-line" data-toggle-group="'+p.id+'" style="width:auto;padding:8px 16px;font-size:13px">➕ הוספה לקבוצה</button>'+
              '<button type="button" class="del" data-delete="'+p.id+'">🗑 מחיקה לגמרי</button>'+
            '</div>'+
            '<div class="hidden row2" data-group-picker="'+p.id+'" style="margin-top:10px">'+
              '<select data-group-select="'+p.id+'"><option value="">טוען קבוצות…</option></select>'+
              '<button type="button" class="btn" data-confirm-group="'+p.id+'" style="width:auto;padding:8px 16px">הוספה</button>'+
            '</div>';
        }
        html+='</td></tr>';
      }
    });
    html+="</tbody></table></div>";
    area.innerHTML=html;

    area.querySelectorAll("[data-add-referral]").forEach(btn=>{
      btn.onclick=async (e)=>{
        e.stopPropagation();
        if(!confirm("ליצור פנייה חדשה (ריקה, לעריכה בהמשך) עבור האדם הזה?")) return;
        try{
          await api("/referrals",{method:"POST",body:JSON.stringify({person_id:btn.dataset.addReferral, status:"לא נוצר קשר"})});
          alert("נוצרה פנייה - אפשר לערוך פרטים מלאים ב-referrals.html");
        }catch(e){ alert("היצירה נכשלה: "+e.message.slice(0,200)); }
      };
    });
    area.querySelectorAll("[data-toggle-group]").forEach(btn=>{
      btn.onclick=async (e)=>{
        e.stopPropagation();
        const pid=btn.dataset.toggleGroup;
        const picker=area.querySelector('[data-group-picker="'+pid+'"]');
        picker.classList.toggle("hidden");
        if(!picker.classList.contains("hidden")){
          try{
            const acts=await api("/activities?select=id,title,type&order=created_at.desc");
            area.querySelector('[data-group-select="'+pid+'"]').innerHTML=
              acts.map(a=>'<option value="'+a.id+'">'+esc(a.type+" - "+a.title)+'</option>').join('');
          }catch(e){ alert("טעינת רשימת הקבוצות נכשלה - יש לוודא הרשאה למודול הפעילויות"); }
        }
      };
    });
    area.querySelectorAll("[data-confirm-group]").forEach(btn=>{
      btn.onclick=async (e)=>{
        e.stopPropagation();
        const pid=btn.dataset.confirmGroup;
        const activityId=area.querySelector('[data-group-select="'+pid+'"]').value;
        if(!activityId) return;
        try{
          await api("/activity_members?on_conflict=activity_id,person_id",{method:"POST",headers:{Prefer:"resolution=ignore-duplicates"},body:JSON.stringify({activity_id:activityId, person_id:pid})});
          alert("נוסף/ה לקבוצה בהצלחה - ניהול מלא ב-activities.html");
          area.querySelector('[data-group-picker="'+pid+'"]').classList.add("hidden");
        }catch(e){ alert("ההוספה נכשלה: "+e.message.slice(0,200)); }
      };
    });
    area.querySelectorAll("[data-delete]").forEach(btn=>{
      btn.onclick=async (e)=>{
        e.stopPropagation();
        if(!confirm("למחוק את האדם הזה לגמרי מהמערכת - כולל כל הפניות, תפקידים, שיוך לקבוצות, וחשבון קהילה אם קיים? פעולה בלתי הפיכה.")) return;
        btn.disabled=true; btn.textContent="מוחק…";
        try{
          await YL.callFunction("delete-person-fully",{person_id:btn.dataset.delete});
          loadPeople();
        }catch(e){ alert("המחיקה נכשלה: "+e.message.slice(0,250)); btn.disabled=false; btn.textContent="🗑 מחיקה לגמרי"; }
      };
    });

    area.querySelectorAll("[data-row]").forEach(row=>{
      row.onclick=()=>{ expanded=(expanded===row.dataset.row)?null:row.dataset.row; editingId=null; render(); };
    });
    area.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation(); editingId=btn.dataset.edit; render(); };
    });
    area.querySelectorAll("[data-cancel]").forEach(btn=>{
      btn.onclick=(e)=>{ e.stopPropagation(); editingId=null; render(); };
    });
    area.querySelectorAll("[data-save]").forEach(btn=>{
      btn.onclick=async (e)=>{
        e.stopPropagation();
        const pid=btn.dataset.save;
        const wrap=btn.closest("td");
        const val=(name)=>wrap.querySelector('[data-e="'+name+'"]').value.trim();
        btn.disabled=true; btn.textContent="שומר…";
        try{
          await api("/persons?id=eq."+pid,{method:"PATCH",body:JSON.stringify({
            first_name: val("first_name")||"ללא שם",
            last_name: val("last_name")||null,
            phone: val("phone")||null,
            email: val("email")||null,
            region_hint: val("region_hint")||null
          })});
          editingId=null;
          loadPeople();
        }catch(e){ alert("השמירה נכשלה: "+e.message.slice(0,200)); btn.disabled=false; btn.textContent="💾 שמירה"; }
      };
    });
  }

  (async function init(){
    if(YL.isLoggedIn()){
      const ok=await YL.refreshSession();
      if(ok){ await showApp(); return; }
    }
    $("viewInitLoading").classList.add("hidden");
    $("viewLock").classList.remove("hidden");
  })();
})();
</script>
</body>
</html>
